[package]
name = "collision2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
winit = "0.30.13"
wgpu = "30"
pollster = "0.4.0"
bytemuck = "1.25.2"
nalgebra = "0.35.0"
itertools = "0.15.0"
rand = "0.10.2"
crossbeam = "0.8.4"
color = "0.3.3"
config = "0.15.25"
serde = { version = "1.0", features = ["derive"], default-features = false }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "rayon",
] }
rayon = "1.12.0"

[build-dependencies]
wgsl_bindgen = "0.23"
